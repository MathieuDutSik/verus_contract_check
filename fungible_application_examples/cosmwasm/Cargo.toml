[package]
name = "fungible-cosmwasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = "2"
cosmwasm-schema = "2"
cw-storage-plus = "2"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
vstd = "=0.0.0-2026-05-17-0151"
verus_fungible_core = { path = "../core" }

[package.metadata.verus]
verify = true

# Allow the verus_only cfg that `cargo verus` sets during verification.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"
