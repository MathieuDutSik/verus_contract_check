[package]
name = "fungible-near"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
borsh = "1"
vstd = "=0.0.0-2026-05-17-0151"
verus_fungible_core = { path = "../core" }

[dev-dependencies]
# Activates near-sdk's `unit-testing` feature for `cargo test --target $HOST`
# (otherwise near-sdk's compile_error trips on non-wasm targets).
# `cargo verus verify --target wasm32-unknown-unknown` doesn't need it,
# because the wasm target itself satisfies the same compile_error gate.
near-sdk = { version = "5", features = ["unit-testing"] }

[package.metadata.verus]
verify = true

# Allow the verus_only cfg that `cargo verus` sets during verification.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
