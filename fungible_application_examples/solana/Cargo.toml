[package]
name = "fungible-solana"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2"
borsh = "1"
thiserror = "1"
vstd = "=0.0.0-2026-05-17-0151"

[features]
no-entrypoint = []

[package.metadata.verus]
verify = true

# Declare the cfgs that `solana_program::entrypoint!` introduces. They are set
# by `cargo-build-sbf` for on-chain builds but not by a host `cargo build`,
# so without this rustc would warn about them as unexpected. The
# `verus_only` cfg is set by `cargo verus` during verification.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic"))',
    'cfg(verus_only)',
] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
