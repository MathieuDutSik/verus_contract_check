[package]
name = "vesting-solana"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2"
borsh = "1"
thiserror = "1"
vstd = "=0.0.0-2026-05-17-0151"
verus_vesting_core = { path = "../core" }

[features]
no-entrypoint = []

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic"))',
    'cfg(verus_only)',
] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
